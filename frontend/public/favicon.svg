<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #1d1d1f; }
    .ink { fill: #ffffff; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ffffff; }
      .ink { fill: #1d1d1f; stroke: #1d1d1f; }
    }
  </style>
  <defs>
    <mask id="m">
      <rect width="64" height="64" rx="16" fill="#fff"/>
      <circle cx="0" cy="32" r="7" fill="#000"/>
      <circle cx="64" cy="32" r="7" fill="#000"/>
    </mask>
  </defs>
  <rect class="tile" width="64" height="64" rx="16" mask="url(#m)"/>
  <rect class="ink" x="20" y="13" width="7" height="38" rx="3.5" stroke="none"/>
  <circle class="ink" cx="34" cy="38" r="11" fill="none" stroke-width="7" style="fill:none"/>
</svg>
